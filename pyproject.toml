[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "groq-gemini-bridge"
version = "0.1.0"
description = "Chatbot library that calls Groq and Gemini with multi-key automatic failover."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["groq", "gemini", "llm", "chatbot", "failover"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
cli = ["python-dotenv"]
api = ["fastapi", "uvicorn", "python-dotenv"]
dev = ["pytest", "build", "twine"]

[project.scripts]
groq-gemini-chat = "groq_gemini_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/groq-gemini-bridge"

[tool.setuptools.packages.find]
where = ["src"]
